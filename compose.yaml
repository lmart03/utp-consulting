services:
  postgres:
    image: postgres:17
    container_name: utp-assistant-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-utp_assistant}
      POSTGRES_USER: ${DB_USERNAME:-utp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-utp_dev_password}
    ports:
      - "${DB_PORT:-2340}:5432"
    volumes:
      - utp-assistant-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  utp-assistant-pgdata:
